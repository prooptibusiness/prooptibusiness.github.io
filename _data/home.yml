hero:
  eyebrow: BUSINESS GROWTH · MARKETING · APPLIED AI
  title: Từ marketing rời rạc đến một hệ tăng trưởng có người chịu trách nhiệm.
  description: PoB giúp Founder, người làm Marketing và đội ngũ SME nối chiến lược, dữ liệu, nội dung, quảng cáo, AI và vận hành thành một cách làm chung — rõ đầu ra, rõ người duyệt và rõ nhịp cải tiến.

